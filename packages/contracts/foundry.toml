[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
extra_output = ["storageLayout"]

[profile.hyperevm]
via_ir = true
optimizer = true
optimizer_runs = 1
out = "out-hyperevm"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
