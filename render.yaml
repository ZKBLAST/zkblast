services:
  # ZKBLAST Mainnet Backend (Unified Web API + Indexer)
  - type: web
    name: zkblast-backend-mainnet
    runtime: node
    plan: starter
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @zkblast/api build && pnpm --filter @zkblast/indexer build
    startCommand: node scripts/run-backend-services.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: mainnet
      - key: CHAIN_ID
        value: "4663"
      - key: CHAIN_NAME
        value: "Robinhood Chain"
      - key: RPC_URL
        value: "https://robinhood-mainnet.g.alchemy.com/v2/alch_4bmR-IIpw9KsDpQnBB1f-"
      - key: WS_RPC_URL
        value: "wss://robinhood-mainnet.g.alchemy.com/v2/alch_4bmR-IIpw9KsDpQnBB1f-"
      - key: BLOCK_EXPLORER_URL
        value: "https://robinhoodchain.blockscout.com"
      - key: DEPLOYMENT_MANIFEST_PATH
        value: "deployments/mainnet/manifest.json"
      - key: SUPABASE_URL
        value: "https://vialfijwtjrwrefljmug.supabase.co"
      - key: SUPABASE_SCHEMA
        value: "zkblast_mainnet"
      - key: WEB_ORIGIN
        value: "https://zkblast.tech"
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DIRECT_DATABASE_URL
        sync: false
      - key: OPERATIONS_API_TOKEN
        sync: false
